apiVersion: v2
name: eoepca
description: Helm chart for the EOEPCA+ Processing building block (OGC API Processes and supporting services).
type: application
kubeVersion: ">=1.34.0-0"
version: 1.0.35
appVersion: "26.10.1"
home: https://github.com/cgi-italy-insula-processing/helm-chart
icon: https://avatars.githubusercontent.com/u/336424038
sources:
  - https://github.com/cgi-italy-insula-processing/helm-chart
  - https://github.com/cgi-italy-insula-processing/insula
  - https://github.com/cgi-italy-insula-processing/ogc-api
maintainers:
  - name: CGI Italy
    url: https://www.cgi.com/italy/it

dependencies:
  - condition: argo-workflows.enabled
    name: argo-workflows
  - condition: broker.enabled
    name: broker
  - condition: docker-registry.enabled
    name: docker-registry
  - condition: minio.enabled
    name: minio
  - condition: ogc-api-processes.enabled
    name: ogc-api-processes
  - condition: postgres.enabled
    name: postgres
  - condition: server.enabled
    name: server
  - condition: worker.enabled
    name: worker
