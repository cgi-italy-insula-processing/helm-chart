# Copy of <release>-minio-storage-secret in the workflows namespace: the input-downloader and
# output-uploader workflow steps read ACCESSKEY/SECRETKEY from it (worker properties).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-minio-storage-secret
  namespace: {{ .Release.Name }}-workflows
type: Opaque
stringData:
  accesskey: {{ .Values.global.storage.accesskey | quote }}
  secretkey: {{ .Values.global.storage.secretkey | quote }}
