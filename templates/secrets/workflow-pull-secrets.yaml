{{- /*
Image pull secrets referenced by every workflow pod (worker properties
platform.worker.workflow.legacy.*ImagePullSecretName). They must exist: Argo reads them to
look up the entrypoint of the input-downloader and output-uploader images and fails the
step when they are missing. The default {"auths":{}} carries no credentials.
*/}}
{{- range .Values.workflowPullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Name }}-workflows
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .dockerconfigjson | default "{\"auths\":{}}" | b64enc }}
{{- end }}
