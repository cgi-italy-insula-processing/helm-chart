{{- if .Values.workflow.serviceAccount.create -}}
  {{- $workflowNamespaces := fromYamlArray (tpl (toYaml .Values.controller.workflowNamespaces) .) }}
  {{- $workflowNamespace := tpl (coalesce .Values.workflow.namespace (include "argo-workflows.namespace" .)) . }}
  {{- range $namespace := or .Values.singleNamespace false | ternary (list "") (append $workflowNamespaces $workflowNamespace | uniq)  }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.workflow.serviceAccount.name }}
  labels:
    {{- include "argo-workflows.labels" (dict "context" $ "component" $.Values.controller.name "name" $.Values.controller.name) | nindent 4 }}
  {{- with $.Values.workflow.serviceAccount.labels  }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
    {{- with $namespace }}
  namespace: {{ . }}
    {{- end }}
    {{- with $.Values.workflow.serviceAccount.annotations }}
  annotations:
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.workflow.serviceAccount.pullSecrets }}
imagePullSecrets:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
