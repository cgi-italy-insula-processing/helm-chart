apiVersion: v1
kind: Service
metadata:
  name: {{ include "ogc-api-processes.serviceName" . }}
  labels:
    {{- include "ogc-api-processes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ogc-api-processes.selectorLabels" . | nindent 4 }}
