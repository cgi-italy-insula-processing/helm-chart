# Default values for server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/cgi-italy-insula-processing/com.cgi.eoss.platform.core/server-core
  tag: 1.48.0-84e09f86
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

# REST API base path of the server (platform.api.basePath).
apiBasePath: /secure/api/v2.0

# Base URL of the job output links. Empty = derived (see server.jobOutputsBaseUrl helper).
jobOutputsBaseUrl: ""

# NOTE: the server is internal-only (ClusterIP) by default; OGC API Processes
# reaches it in-cluster at <release>-server-service:8090. Enable ingress below
# only to expose specific endpoints externally, listing just the paths needed.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /api/some-endpoint
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    memory: 4Gi
  requests:
    cpu: 100m
    memory: 128Mi

# Spring Boot actuator health groups on the application port. The actuator answers
# 406 to the kubelet default "Accept: */*", so the probes ask for JSON explicitly.
# The liveness delay leaves room for the database migrations at first start.
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
    httpHeaders:
      - name: Accept
        value: application/json
  initialDelaySeconds: 90
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
    httpHeaders:
      - name: Accept
        value: application/json
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

hostAliases: []

applicationName: server
serverPort: 8090

logConfig:
    mountPath: /var/platform/server/log4j2.xml
    subPath: log4j2.xml

# Data volume mounted at /data. When persistence.enabled is set, the chart
# creates a PVC named <release>-server-data.
persistence:
  enabled: true
  # Empty = cluster default StorageClass. Use "-" to disable dynamic provisioning.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations:
    # Keep the PVC when the Helm release is deleted.
    helm.sh/resource-policy: keep
