# files/dbInit/*.sql rendered as a Secret, mounted at /opt/dbinit and run by update-postgresql.sh.

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql-initdb-secret
type: Opaque
data:
{{- range $path, $_ := .Files.Glob "files/dbInit/*.sql" }}
{{ base $path | indent 2 }}: {{ tpl ($.Files.Get $path) $ | b64enc }}
{{ end }}
