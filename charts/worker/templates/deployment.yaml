apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "worker.name" . }}
    helm.sh/chart: {{ include "worker.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "worker.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Roll the pod when application.properties or log4j2.xml change.
        checksum/config: {{ include (print $.Template.BasePath "/worker-config-properties.yaml") . | sha256sum }}
        checksum/log-config: {{ include (print $.Template.BasePath "/configmap/platform-worker-log4j2-configmap.yaml") . | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "worker.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      containers:
        - env:
           - name: SPRING_APPLICATION_NAME
             value: {{ .Values.applicationName }}
           - name: WORKER_DB_PASSWORD
             valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.dbSecret.name . }}
                  key: {{ .Values.dbSecret.key }}
           - name: ACTIVEMQ_USER
             valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global.activemq).secretname}}
                  key: {{ (.Values.global.activemq).usersecretkey}}
           - name: ACTIVEMQ_PASSWORD
             valueFrom:
                secretKeyRef:
                  name: {{ (.Values.global.activemq).secretname}}
                  key: {{ (.Values.global.activemq).pwdsecretkey}}
          name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: log-config
              mountPath: {{ .Values.logConfig.mountPath }}
              subPath: {{ .Values.logConfig.subPath }}
            - name: worker-config
              mountPath: /application.properties
              subPath: application.properties
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
      volumes:
        - name: log-config
          configMap:
            name: {{ .Release.Name }}-platform-worker-log-config
        - name: worker-config
          configMap:
            name: {{ .Release.Name }}-worker-config
