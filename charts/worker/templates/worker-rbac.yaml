apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: {{ .Release.Namespace }}
{{- /*
The worker and the event collector only call the Kubernetes API in <release>-workflows:
the worker creates, lists and deletes the per-job PVCs and the Argo Workflows; the event
collector lists and watches pods and workflows. The ServiceAccount has no rights elsewhere.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Name }}-workflows
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Release.Name }}-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-worker
subjects:
  - kind: ServiceAccount
    name: worker-sa
    namespace: {{ .Release.Namespace }}
