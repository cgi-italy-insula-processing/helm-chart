# Default values for broker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
updateStrategy:
  type: Recreate

initContainer:
  image:
    repository: busybox
    tag: 1.37.0

image:
  repository: apache/activemq-classic
  tag: 6.1.7
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

config:
  baseHref: /admin
  activemqXml: true

persistence:
  enabled: true
  # If empty, the chart creates a new PVC. Set this to the name of an existing PVC to reuse it instead.
  existingClaim: ""
  # If empty, Kubernetes uses the cluster's default StorageClass. Set a specific StorageClass name if required by the target environment. Use "-" to disable dynamic provisioning.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  subPath: activemq-data
  annotations:
    # Keep the PVC when the Helm release is deleted.
    helm.sh/resource-policy: keep
