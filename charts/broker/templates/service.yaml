apiVersion: v1
kind: Service
metadata:
  name: {{ include "broker.serviceName" . }}
  labels:
    app.kubernetes.io/name: {{ include "broker.name" . }}
    helm.sh/chart: {{ include "broker.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: 8161
    targetPort: http
  - name: core
    port: 61616
    targetPort: core
  - name: stomp
    port: 61613
    targetPort: stomp
  selector:
    app.kubernetes.io/name: {{ include "broker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
